<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Playlist</title>
  <style>
    body {
      background-color: rgb(204, 204, 204);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h1, h2 {
      text-align: center;
      margin: 10px 0;
    }

    .container {
      width: 90%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .song-list {
      background-color: #f0f0f0;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 15px;
      width: 250px;
      align-self: flex-start;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .song-list ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .song-list li {
      margin: 8px 0;
      font-weight: bold;
    }

    .song-list a {
      text-decoration: none;
      color: #000;
    }

    .player {
      background-color: #fff;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border: 2px solid #333;
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    video, audio {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>My Playlist</h1>

    <div class="song-list">
      <ul>
        <li><a href="#" target="_blank">Song 1</a></li>
        <li><a href="#" target="_blank">Song 2</a></li>
        <li><a href="#" target="_blank">Song 3</a></li>
        <li><a href="#" target="_blank">Song 4</a></li>
        <li><a href="#" target="_blank">Song 5</a></li>
      </ul>
    </div>

    <h2>Now Playing...</h2>

    <div class="player player_one">
      <video controls>
        <source src="https://www.w3schools.com/tags/movie.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <h2>MP3 songs</h2>
    <div class="player player_two">
      <audio controls>
        <source src="https://www.pagalworld.com.se/files/download/id/64630" type="audio/mpeg">
        Your browser does not support the audio tag.
      </audio>
    </div>
  </div>

</body>
</html>
